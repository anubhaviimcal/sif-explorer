name: Update SIF data
on:
  schedule:
    - cron: "30 18 * * 1-6"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sif_pipeline.py run
      - run: |
          mkdir -p docs/data
          cp output/sif.json docs/data/sif.json
          git config user.name "sif-bot"
          git config user.email "sif-bot@users.noreply.github.com"
          git add cache output manual_fields.csv docs/data
          git diff --cached --quiet || git commit -m "Update SIF data"
          git push
